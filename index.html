<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto</title>
    <style>
        :root {
            --bg-principal: #121214;
            --bg-card: #1f1f23;
            --texto-principal: #ffffff;
            --texto-secundario: #a4a4a8;
            --cor-accent: #8257e5;
            --cor-accent-hover: #9466ff;
            --borda: #29292e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            line-height: 1.6;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .topo-imagem {
            width: 100%;
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            border: 4px solid var(--cor-accent);
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(130, 87, 229, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            color: var(--texto-secundario);
            margin-bottom: 24px;
        }

        .audio-player-container {
            background-color: var(--bg-principal);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            margin-bottom: 24px;
        }

        .audio-player-container label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--texto-secundario);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .btn-link {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: var(--cor-accent);
            color: var(--texto-principal);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(130, 87, 229, 0.2);
        }

        .btn-link:hover {
            background-color: var(--cor-accent-hover);
        }

        .btn-link:active {
            transform: scale(0.98);
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.5rem;
            }
            .container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="lobos.png" alt="Logo Lobos" class="topo-imagem" onerror="this.style.display='none';">

        <h1>Projeto Lobos</h1>
        
        <p>Abaixo você pode ouvir a faixa exclusiva do projeto diretamente do seu smartphone.</p>

        <div class="audio-player-container">
            <label for="player">Player de Áudio</label>
            <audio id="player" controls>
                <source src="pupila.mp3" type="audio/mpeg">
                Seu navegador não suporta a reprodução deste áudio.
            </audio>
        </div>

        <a href="#" class="btn-link">Acessar Repositório</a>
    </div>

</body>
</html>
